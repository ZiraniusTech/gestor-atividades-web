<div id="agendaView" class="p-4 md:p-6">
    <div class="content-card max-w-3xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-700 mb-6">Agenda de Compromissos</h2>
        <div class="mb-8 p-6 border border-gray-200 rounded-lg">
            <h3 class="text-xl font-semibold text-gray-700 mb-4">Novo Compromisso</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="compromissoAssunto" class="block text-sm font-medium text-gray-700">Assunto:</label>
                    <select id="compromissoAssunto" class="input-field">
                        <option value="reuniao">Reunião</option>
                        <option value="treinamentos">Treinamentos</option>
                        <option value="data_comemorativa">Data Comemorativa</option>
                        <option value="viagem">Viagem</option>
                        <option value="lembretes">Lembretes</option>
                        <option value="ferias">Férias</option>
                    </select>
                </div>
                <div>
                    <label for="compromissoData" class="block text-sm font-medium text-gray-700">Data:</label>
                    <input type="date" id="compromissoData" class="input-field">
                </div>
                <div>
                    <label for="compromissoHora" class="block text-sm font-medium text-gray-700">Hora:</label>
                    <input type="time" id="compromissoHora" class="input-field">
                </div>
                <div class="md:col-span-2">
                    <label for="compromissoDescricao" class="block text-sm font-medium text-gray-700">Descrição:</label>
                    <textarea id="compromissoDescricao" rows="3" class="input-field" placeholder="Detalhes..."></textarea>
                </div>
            </div>
            <button id="salvarCompromissoButton" class="btn btn-primary w-full mt-6">Salvar Compromisso</button>
        </div>
        <div>
            <h3 class="text-xl font-semibold text-gray-700 mb-4">Meus Compromissos</h3>
            <div id="listaCompromissosContainer" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
            <button id="excluirSelecionadosButton" class="btn btn-danger mt-4 hidden">Excluir Selecionados</button>
        </div>
    </div>
</div>
