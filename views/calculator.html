<div id="calculatorView" class="p-4 md:p-6">
    <div class="content-card max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-700 mb-6 text-center">Calcular Diárias</h2>
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Partida:</label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2">
                <div><label for="departureDate" class="block text-xs font-medium text-gray-600">Data:</label><input type="date" id="departureDate" class="input-field"></div>
                <div><label for="departureTime" class="block text-xs font-medium text-gray-600">Hora:</label><input type="time" id="departureTime" class="input-field"></div>
            </div>
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Retorno:</label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2">
                <div><label for="returnDate" class="block text-xs font-medium text-gray-600">Data:</label><input type="date" id="returnDate" class="input-field"></div>
                <div><label for="returnTime" class="block text-xs font-medium text-gray-600">Hora:</label><input type="time" id="returnTime" class="input-field"></div>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div><label for="selectDestino" class="block text-sm font-medium text-gray-700 mb-1">Destino:</label><select id="selectDestino" class="input-field"></select></div>
            <div><label for="selectCargo" class="block text-sm font-medium text-gray-700 mb-1">Cargo:</label><select id="selectCargo" class="input-field"></select></div>
        </div>
        <button id="calculateButton" class="btn btn-primary w-full mb-6">Calcular Diárias</button>
        <div id="results" class="mt-6 p-6 bg-gray-50 rounded-lg shadow-inner hidden">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">Resultado do Cálculo:</h3>
            <div class="space-y-2 text-gray-700">
                <p><strong>Partida:</strong> <span id="departureInfo"></span></p>
                <p><strong>Retorno:</strong> <span id="returnInfo"></span></p>
                <p><strong>Duração Total:</strong> <span id="totalDuration"></span> horas</p>
                <p><strong>Diárias Completas:</strong> <span id="fullDays"></span></p>
                <p><strong>Meias Diárias:</strong> <span id="halfDays"></span></p>
                <p class="text-2xl font-bold text-green-600 mt-4">Valor Total: R$ <span id="totalAllowance"></span></p>
            </div>
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4 no-print">
                <button id="newCalculationButton" class="btn btn-secondary w-full">Novo Cálculo</button>
                <button id="printButton" class="btn btn-success w-full">Imprimir Relatório</button>
            </div>
        </div>
    </div>
</div>
